name: nexo-portfolio
services:
  db:
    image: mysql:8.0.44
    environment:
      MYSQL_DATABASE: nexo
      MYSQL_USER: nexo
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.sh}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/setup.sh}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin ping -h localhost -u nexo --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:php8.4-apache@sha256:41815427d043bc629359121b347e2f1e4b7aba502062c369c2922f1d666ebf2a
    ports:
      - '127.0.0.1:8092:80'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: nexo
      WORDPRESS_DB_USER: nexo
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wordpress:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/nexo
      - ./plugin:/var/www/html/wp-content/plugins/nexo-commerce
      - ./scripts:/opt/nexo:ro
      - ./assets:/opt/nexo-assets:ro
      - ./.runtime:/opt/nexo-runtime
      - ./.env:/opt/nexo-env:ro
volumes:
  database:
  wordpress:
